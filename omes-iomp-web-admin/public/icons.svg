<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 40" preserveAspectRatio="none">
  <defs>
    <linearGradient id="bridge-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12242e" stop-opacity="0.98"/>
      <stop offset="45%" stop-color="#0f1f28" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#0b171e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bridge-glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#5bf3f9" stop-opacity="0.75"/>
      <stop offset="55%" stop-color="#5bf3f9" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#5bf3f9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="side-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5bf3f9" stop-opacity="0"/>
      <stop offset="35%" stop-color="#5bf3f9" stop-opacity="0.35"/>
      <stop offset="65%" stop-color="#5bf3f9" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5bf3f9" stop-opacity="0"/>
