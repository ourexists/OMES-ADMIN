  <path fill="url(#bridge-fill)" d="M0,0 H660 L960,16 L1260,0 H1920 V40 H0 Z"/>
  <path stroke="url(#side-line)" stroke-width="1" fill="none" d="M0,0.5 H660 M1260,0.5 H1920"/>
