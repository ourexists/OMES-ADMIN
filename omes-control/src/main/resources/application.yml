server:
  port: ${OMES_CONTROL_PORT:10015}

spring:
  application:
    name: OMES-CONTROL
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:TyY6Df3bZe}
    virtual-host: "${RABBITMQ_VHOST:/}"
    listener:
      simple:
        prefetch: ${RABBITMQ_EQUIP_CONTROL_PREFETCH:1}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:5s}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:50}
          max-idle: ${REDIS_POOL_MAX_IDLE:20}
          min-idle: ${REDIS_POOL_MIN_IDLE:5}
          max-wait: ${REDIS_POOL_MAX_WAIT:2s}
  cache:
    type: redis

feign:
  client:
    config:
      default:
        connectTimeout: 20000
        readTimeout: 10000

omes:
  rabbitmq:
    equip_control_concurrency: ${RABBITMQ_EQUIP_CONTROL_CONCURRENCY:4}
