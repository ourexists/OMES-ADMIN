server:
  port: ${OMES_SAS_PORT:10012}
  servlet:
    context-path: /

spring:
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
  application:
    name: OMES-SAS
  profiles:
    include: db-postgres
  config:
    location: classpath:/,file:config/
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: ALWAYS
    time-zone: GMT+8
  messages:
    basename: i18n/messages
  main:
    allow-bean-definition-overriding: true
    allow-circular-references: true
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:5s}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:50}
          max-idle: ${REDIS_POOL_MAX_IDLE:20}
          min-idle: ${REDIS_POOL_MIN_IDLE:5}
          max-wait: ${REDIS_POOL_MAX_WAIT:2s}
  cache:
    type: redis

management:
  endpoint:
    health:
      show-details: never
    shutdown:
      access: read_only
  endpoints:
    web:
      base-path: ${server.servlet.context-path}
      exposure:
        include:
          - "health"
          - "shutdown"

era:
  log:
    level: info
    file:
      path: log/
  permission:
    ignore:
      auth_check:
        - /expose/**
        - /open/**
        - /authentication/**
        - /oauth2/**
        - /.well-known/**
      api_check:
        - /expose/**
        - /open/**
        - /authentication/**
        - /oauth2/**
        - /.well-known/**
  token:
    store-type: Redis

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

omes:
  remote:
    # SAS 调 Admin 拉账户数据；与 Admin 同机部署时用本机地址，勿固定 127.0.0.1
    admin-url: ${OMES_ADMIN_URL:http://127.0.0.1:10010}
  cors:
    allowed-origin-patterns:
      - http://127.0.0.1:*
      - http://localhost:*
      - http://*:*
      - https://*:*

feign:
  client:
    config:
      default:
        connectTimeout: 20000
        readTimeout: 10000

ai:
  bridge:
    ticket-ttl-seconds: ${AI_BRIDGE_TICKET_TTL_SECONDS:120}
    internal-key: ${AI_BRIDGE_INTERNAL_KEY:omes-bridge-internal}

logging:
  level:
    org:
      springframework:
        security: INFO
