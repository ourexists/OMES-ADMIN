server:
  port: ${OMES_GATEWAY_PORT:${OMES_SAS_PORT:9400}}
  servlet:
    context-path: /

spring:
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
  application:
    name: OMES-SAS
  profiles:
    include: db-postgres
  config:
    import:
      - optional:file:config/era-token.yml
    location: classpath:/,file:config/
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: ALWAYS
    time-zone: GMT+8
  messages:
    basename: i18n/messages
  main:
    allow-bean-definition-overriding: true
    allow-circular-references: true
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:5s}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:50}
          max-idle: ${REDIS_POOL_MAX_IDLE:20}
          min-idle: ${REDIS_POOL_MIN_IDLE:5}
          max-wait: ${REDIS_POOL_MAX_WAIT:2s}
  cache:
    type: redis

management:
  endpoint:
    health:
      show-details: never
    shutdown:
      access: read_only
  endpoints:
    web:
      base-path: ${server.servlet.context-path}
      exposure:
        include:
          - "health"

era:
  log:
    level: info
    file:
      path: log/
  permission:
    ignore:
      auth_check:
        - /expose/**
        - /open/**
        - /authentication/**
        - /oauth2/**
        - /.well-known/**
        - /message/ws
      api_check:
        - /expose/**
        - /open/**
        - /authentication/**
        - /oauth2/**
        - /.well-known/**
  token:
    store-type: Redis

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}

omes:
  remote:
    # SAS Feign 调 Admin；网关 upstream 默认同一地址
    admin-url: ${OMES_ADMIN_URL:http://127.0.0.1:10010}
  gateway:
    enabled: ${OMES_GATEWAY_ENABLED:true}
    admin-url: ${OMES_ADMIN_URL:http://127.0.0.1:10010}
  internal:
    service-key: ${OMES_INTERNAL_SERVICE_KEY:dev-internal-change-me}
  auth-rate-limit:
    captcha-per-minute: ${OMES_AUTH_CAPTCHA_RATE:60}
    token-per-minute: ${OMES_AUTH_TOKEN_RATE:30}
    register-per-minute: ${OMES_AUTH_REGISTER_RATE:10}
  cors:
    allowed-origin-patterns:
      - "*"
      - http://127.0.0.1:*
      - http://localhost:*
      - http://192.168.*.*:*
      - http://10.*.*.*:*
      - http://172.*.*.*:*

feign:
  client:
    config:
      default:
        connectTimeout: 20000
        readTimeout: 10000

ai:
  bridge:
    ticket-ttl-seconds: ${AI_BRIDGE_TICKET_TTL_SECONDS:120}
    internal-key: ${AI_BRIDGE_INTERNAL_KEY:dev-bridge-change-me}

logging:
  level:
    org:
      springframework:
        security: INFO
