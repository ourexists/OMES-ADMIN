# 二段硫化工序引擎模板（segments 由工序 params 注入，其次 stepScript）
# name 与工艺工序 stepName 匹配（忽略空白），命中后自动套用本模板
process:
  recipes:
    room-temp-cure:
      name: 二段硫化
      description: 驱动等待烘箱温度→斜坡升温→人工确认完成；斜坡段参数来自工序 params
      engine:
        type: COMBINATION
        mode: UNIT
        scriptVersion: 3
        combinations:
          - name: 段1
            phaseOrder:
              - ACTION
              - DRIVE
              - COMPLETE
            drive:
              kind: EVENT
              condition: "@烘箱:temp>=60"
              aviatorExpression: "pv('烘箱','temp') >= 60.0"
            action:
              type: RAMP
              mode: TIME
              segments: []
              afterControl:
                enabled: true
                equipmentCode: 烘箱
                variable: pressure
                target: 0.0
              equipmentCode: 烘箱
              variable: temp
            complete:
              kind: MANUAL_CONFIRM
              aviatorExpression: "manualConfirmed(phaseKey)"
            exception:
              kind: NONE
              aviatorExpression: "true"
