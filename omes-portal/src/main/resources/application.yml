server:
  port: 10010
  servlet:
    context-path: /
spring:
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:TyY6Df3bZe}
    # 必须带引号，否则 YAML 会把 `/` 误解析；需与 omes-stream（Flink RMQSource）使用同一 vhost
    virtual-host: "${RABBITMQ_VHOST:/}"
  messages:
    basename: i18n/messages
  thymeleaf:
    cache: false
  mvc:
    static-path-pattern: static/**
  application:
    name: OMES-ADMIN
  config:
    location: classpath:/,file:config/
  profiles:
    include: db-postgres
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: ALWAYS
    time-zone: GMT+8
  cloud:
    loadbalancer:
      retry:
        enabled: true
    # 多个 Consumer 时必须显式声明 function.definition（见 Spring Cloud Stream 文档）
    function:
      definition: equipStreamPersistChange;equipStreamPersistStateSnapshot;equipStreamPersistCollectSnapshot;equipNotifyCreate
    # 设备侧 RabbitMQ 走 Spring Cloud Stream + rabbit binder；换 Kafka 等 broker 时可改 binder 与中继拓扑（Flink omes-stream 仍为独立 AMQP 客户端）
    stream:
      default-binder: rabbit
      # 站内通知经 StreamBridge 出站，再由 notifyMessageDispatch 消费（与 equipRealtime-out 同源模式）
      source: notifyMessageSource
      bindings:
        equipRealtime-out-0:
          destination: ${OMES_EQUIP_REALTIME_QUEUE:omes.equip.realtime}
          # 随生产者声明 TopicExchange + 与 Flink 共用的持久队列（queue-name-group-only 见 rabbit 段）
          producer:
            required-groups:
              - ${OMES_EQUIP_REALTIME_QUEUE:omes.equip.realtime}
        # 仅消费 Flink 桥接 sink 已声明的队列：destination/group 与物理队列名一致
        equipStreamPersistChange-in-0:
          destination: ${OMES_EQUIP_STREAM_PERSIST_CHANGE_QUEUE:omes.equip.stream.persist.change}
          group: ${OMES_EQUIP_STREAM_PERSIST_CHANGE_QUEUE:omes.equip.stream.persist.change}
        equipStreamPersistStateSnapshot-in-0:
          destination: ${OMES_EQUIP_STREAM_PERSIST_STATE_QUEUE:omes.equip.stream.persist.state}
          group: ${OMES_EQUIP_STREAM_PERSIST_STATE_QUEUE:omes.equip.stream.persist.state}
        equipStreamPersistCollectSnapshot-in-0:
          destination: ${OMES_EQUIP_STREAM_PERSIST_COLLECT_QUEUE:omes.equip.stream.persist.collect}
          group: ${OMES_EQUIP_STREAM_PERSIST_COLLECT_QUEUE:omes.equip.stream.persist.collect}
        equipNotifyCreate-in-0:
          destination: ${OMES_EQUIP_NOTIFY_CREATE_QUEUE:omes.notify.create}
          group: ${OMES_EQUIP_NOTIFY_CREATE_QUEUE:omes.notify.create}
      rabbit:
        bindings:
          equipRealtime-out-0:
            producer:
              queue-name-group-only: true
          equipStreamPersistChange-in-0:
            consumer:
              bind-queue: false
              declare-exchange: false
              queue-name-group-only: true
          equipStreamPersistStateSnapshot-in-0:
            consumer:
              bind-queue: false
              declare-exchange: false
              queue-name-group-only: true
          equipStreamPersistCollectSnapshot-in-0:
            consumer:
              bind-queue: false
              declare-exchange: false
              queue-name-group-only: true
          equipNotifyCreate-in-0:
            consumer:
              bind-queue: false
              declare-exchange: false
              queue-name-group-only: true
  main:
    allow-bean-definition-overriding: true
    allow-circular-references: true
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:5s}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:50}
          max-idle: ${REDIS_POOL_MAX_IDLE:20}
          min-idle: ${REDIS_POOL_MIN_IDLE:5}
          max-wait: ${REDIS_POOL_MAX_WAIT:2s}
  cache:
    type: redis

management:
  endpoint:
    health:
      show-details: never
    shutdown:
      access: read_only
  endpoints:
    web:
      base-path: ${server.servlet.context-path}
      exposure:
        include:
          - "health"
          - "shutdown"
ribbon:
  restclient:
    enabled: true
  okhttp:
    enabled: true
era:
  log:
    level: info
    file:
      path: log/
  permission:
    ignore:
      auth_check:
        - /expose/**
        - /
        - /templates/**
        - /view/**
        - /files/**
      #        - /workshop/**
      api_check:
        - /expose/**
        - /
        - /templates/**
        - /view/**
        - /files/**
  #        - /workshop/**
  token:
    store-type: redis
feign:
  client:
    config:
      default:
        connectTimeout: 20000
        readTimeout: 10000

#logging:
#  level:
#    org:
#      springframework:
#        ws: TRACE
logging:
  level:
    org:
      springframework:
        security: DEBUG
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

ai:
  proxy:
    base-url: ${AI_APP_BASE_URL:http://127.0.0.1:10011}

omes:
  equip:
    # change 消息聚合成批再调 device 批量接口：条数阈值与最大等待（毫秒，防抖）
    stream-persist-batch-size: ${OMES_EQUIP_STREAM_PERSIST_BATCH_SIZE:32}
    stream-persist-batch-flush-ms: ${OMES_EQUIP_STREAM_PERSIST_BATCH_FLUSH_MS:200}
    # stream eventId Redis 幂等键存活时间（小时）；过期后同 eventId 可再次入库
    stream-persist-idempotent-ttl-hours: ${OMES_EQUIP_STREAM_PERSIST_IDEMPOTENT_TTL_HOURS:168}


