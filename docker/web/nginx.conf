# 静态 SPA + 同源反代 SAS（避免浏览器跨域）
# SPA 路由：/ /login /view/* /403 ；其余路径一律走网关
# upstream 用宿主机端口，兼容 Compose / IDEA 单独起 SAS

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream omes_sas {
    server host.docker.internal:9400;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 构建产物
    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    location ~* \.(ico|png|jpg|jpeg|gif|svg|webp|woff2?|ttf|map|webmanifest|txt)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Vue 前端路由（与 router 一致）
    location = / {
        try_files /index.html =404;
    }
    location = /index.html {
        try_files /index.html =404;
    }
    location = /login {
        try_files /index.html =404;
    }
    location = /403 {
        try_files /index.html =404;
    }
    location ^~ /view/ {
        try_files /index.html =404;
    }

    # 业务 / OAuth / OpenAPI → SAS（同源，无跨域）
    location / {
        proxy_pass http://omes_sas;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
