spring:
  application:
    name: omes-iomp-flinker-equip

# 日志文件目录（见 logback-spring.xml）；可用环境变量 LOGGING_FILE_PATH 覆盖
logging:
  file:
    path: log/omes-iomp-flinker-equip

# 与 EquipRealtimeFlinkRmqConfig / RabbitMQ 客户端一致（可被环境变量覆盖）
RABBITMQ_HOST: 127.0.0.1
RABBITMQ_PORT: 5672
RABBITMQ_USERNAME: admin
RABBITMQ_PASSWORD: TyY6Df3bZe
RABBITMQ_VHOST: "/"

omes:
  device:
    offline-timeout-ms: 90000
    snapshot-interval-ms: 30000
    attr-fluctuation-window-ms: 90000
    attr-fluctuation-slide-ms: 5000
    rabbitmq:
      equip-realtime-queue: omes.equip.realtime
      equip-notify-create-queue: omes.notify.create
      equip-stream-persist-change-queue: omes.equip.stream.persist.change
      equip-stream-persist-state-queue: omes.equip.stream.persist.state
      equip-stream-persist-collect-queue: omes.equip.stream.persist.collect
    flink:
      enable-checkpointing: false
      checkpoint-interval-ms: 10000
      checkpoint-timeout-ms: 120000
      unaligned-checkpoint: true
      aligned-checkpoint-timeout-ms: 30000
      rmq-prefetch: 100
      parallelism: 1
      change-detect-ingress-windowed: false
      change-detect-ingress-window-ms: 60000
      change-detect-ingress-slide-ms: 60000
      state-ttl-minutes:
        offline-detect: -1
        change-detect: -1
        attr-fluctuation: -1
        state-snapshot: -1
        collect-snapshot: -1
